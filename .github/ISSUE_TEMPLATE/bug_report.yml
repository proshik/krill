name: Bug report
description: Something in Krill doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, please don't use this form — see SECURITY.md.
        Remove passwords, tokens and connection strings from anything you paste.
  - type: input
    id: version
    attributes:
      label: Krill version
      description: The release tag, or the commit if you built from source.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is Krill installed?
      options:
        - install.sh (host binary + systemd)
        - Container image
        - Built from source
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and architecture, Docker version, number of Swarm nodes.
      placeholder: Ubuntu 24.04 amd64, Docker 28.5, 1 node
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Steps to reproduce, what you expected, and what happened instead.
      placeholder: |
        1. Create an image app with ...
        2. Click Deploy
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output of `journalctl -u krill`, the deployment log, or the service logs.
      render: text
