# Release: builds and pushes a multi-arch image to GHCR.
# - Tag push (vX.Y.Z): builds + pushes semver/sha/latest tags AND creates a
#   GitHub Release.
# - workflow_dispatch: builds + pushes a branch/sha tag, but SKIPS the GitHub
#   Release (no git tag is present).
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release
  packages: write # push to ghcr.io

jobs:
  release:
    name: build, push, release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ${{ github.repository_owner }} keeps this working for any owner/fork.
      # Image: ghcr.io/<owner>/krill
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/krill
          tags: |
            # semver tags on a v*.*.* tag push
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # short commit sha — applies to tag pushes and manual runs
            type=sha
            # branch name — used for workflow_dispatch (no git tag) runs
            type=ref,event=branch
            # 'latest' only on a git tag push
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cross-compile static binaries for the installer (host binary + systemd).
      # Relies on the committed generated files, same as the image build.
      - name: Set up Go
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          # Both binaries stamp the same internal/buildinfo.Version symbol, so
          # `krill --version` and `krill-cli version` report the same tag.
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X github.com/proshik/krill/internal/buildinfo.Version=${VERSION}"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
              -trimpath -ldflags="${LDFLAGS}" \
              -o "dist/krill-linux-$arch" ./cmd/krill
          done

          # krill-cli is a client, so it also ships for macOS. It is packaged
          # as a tarball rather than a bare binary because a bare binary
          # downloaded through a browser gets macOS's quarantine attribute
          # and refuses to run; `curl | tar` does not set it.
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build \
                -trimpath -ldflags="${LDFLAGS}" \
                -o "dist/krill-cli" ./cmd/krill-cli
              (cd dist && tar -czf "krill-cli_${VERSION}_${os}_${arch}.tar.gz" krill-cli && rm krill-cli)
            done
          done

          # install.sh reads this file with `awk '$2==a'` over BARE asset
          # names and fails closed when its entry is missing, so the server
          # assets must keep both their names and their format here. Extra
          # lines for the CLI tarballs are harmless to that lookup.
          (cd dist && sha256sum krill-linux-* krill-cli_*.tar.gz > checksums.txt)

      # Only on a v*.*.* tag push. Skipped for workflow_dispatch (no tag).
      # Attaches the installer binaries + checksums so install.sh can fetch
      # releases/latest/download/krill-linux-<arch>.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        # Pinned to a full commit SHA (not the mutable v2 tag): this third-party
        # action uploads the binaries install.sh runs as root, so a hijacked tag
        # would be a root-RCE supply-chain vector. Bump the SHA via Dependabot.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/krill-linux-amd64
            dist/krill-linux-arm64
            dist/krill-cli_*.tar.gz
            dist/checksums.txt
