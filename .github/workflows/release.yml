# Release: builds and pushes a multi-arch image to GHCR.
# - Tag push (vX.Y.Z): builds + pushes semver/sha/latest tags AND creates a
#   GitHub Release.
# - workflow_dispatch: builds + pushes a branch/sha tag, but SKIPS the GitHub
#   Release (no git tag is present).
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release
  packages: write # push to ghcr.io

jobs:
  release:
    name: build, push, release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ${{ github.repository_owner }} keeps this working for any owner/fork.
      # Image: ghcr.io/<owner>/krill
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/krill
          tags: |
            # semver tags on a v*.*.* tag push
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # short commit sha — applies to tag pushes and manual runs
            type=sha
            # branch name — used for workflow_dispatch (no git tag) runs
            type=ref,event=branch
            # 'latest' only on a git tag push
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only on a v*.*.* tag push. Skipped for workflow_dispatch (no tag).
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
