version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/database/migrations"
    queries: "internal/database/queries"
    gen:
      go:
        package: "db"
        out: "internal/database/gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true
        overrides:
          - column: "applications.env"
            go_type:
              type: "map[string]string"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
