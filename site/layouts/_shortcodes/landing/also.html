{{- /*
The rest of the features, as a two-column list of landing/item entries.

@param {string} title The section heading.
*/ -}}
<section class="krill-section krill-also" id="features" aria-labelledby="features-title">
  <h2 id="features-title" class="krill-h2">{{ .Get "title" }}</h2>
  <dl class="krill-also__list">{{ .Inner }}</dl>
</section>
