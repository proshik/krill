{{- /*
The close: the install command and what it does. The body is Markdown, rendered with Hextra's
render hooks so the code block gets its copy button.

@param {string} title The section heading.
*/ -}}
<section class="krill-section krill-start" id="quick-start" aria-labelledby="quick-start-title">
  <div class="krill-start__inner">
    <h2 id="quick-start-title" class="krill-h2">{{ .Get "title" }}</h2>
    <div class="content krill-prose">{{ .Inner | $.Page.RenderString (dict "display" "block") }}</div>
  </div>
</section>
